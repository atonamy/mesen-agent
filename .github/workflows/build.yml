name: Agent CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  skill:
    name: Agent skill discovery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover mesen-agent through the standard skills CLI
        run: npx --yes skills@latest add . --list | tee skill-list.txt
      - name: Require the bundled skill
        run: grep -q "mesen-agent" skill-list.txt

  macos:
    name: mesen-agent / macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build only the native agent CLI
        run: make agent -j"$(sysctl -n hw.logicalcpu)" LTO=false STATICLINK=false SYSTEM_LIBEVDEV=false
      - name: Test build-tree CLI
        run: bash Headless/tests/smoke.sh
      - name: Assemble standalone CLI bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bundle="dist/mesen-agent-macos-$ARCH"
          output="bin/osx-$ARCH/Release"
          mkdir -p "$bundle"
          cp "$output/mesen-agent" "$output/MesenCore.dylib" LICENSE "$bundle/"

          MESEN_AGENT="$PWD/$bundle/mesen-agent" bash Headless/tests/smoke.sh
          tar -czf "dist/mesen-agent-macos-$ARCH.tar.gz" -C "$bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: mesen-agent-macos-${{ matrix.arch }}
          path: dist/mesen-agent-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  linux:
    name: mesen-agent / Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build only the native agent CLI
        run: make agent -j"$(nproc)" LTO=false STATICLINK=false SYSTEM_LIBEVDEV=false
      - name: Test build-tree CLI
        run: bash Headless/tests/smoke.sh
      - name: Assemble standalone CLI bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bundle="dist/mesen-agent-linux-$ARCH"
          output="bin/linux-$ARCH/Release"
          mkdir -p "$bundle"
          cp "$output/mesen-agent" "$output/MesenCore.so" LICENSE "$bundle/"

          MESEN_AGENT="$PWD/$bundle/mesen-agent" bash Headless/tests/smoke.sh
          tar -czf "dist/mesen-agent-linux-$ARCH.tar.gz" -C "$bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: mesen-agent-linux-${{ matrix.arch }}
          path: dist/mesen-agent-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    name: mesen-agent / Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build only the native agent CLI
        shell: pwsh
        run: msbuild Mesen.sln -nologo -m -p:Configuration=Release -p:Platform=x64 -p:MesenAgentHeadless=true -t:Headless
      - name: Require native CLI outputs
        shell: pwsh
        run: |
          if (-not (Test-Path "bin/win-x64/Release/mesen-agent.exe")) { throw "mesen-agent.exe was not built" }
          if (-not (Test-Path "bin/win-x64/Release/MesenCore.dll")) { throw "MesenCore.dll was not built" }
      - name: Test build-tree CLI
        shell: bash
        run: |
          export MESEN_AGENT="$(cygpath -u "$GITHUB_WORKSPACE")/bin/win-x64/Release/mesen-agent.exe"
          bash Headless/tests/smoke.sh
      - name: Assemble standalone CLI bundle
        shell: pwsh
        run: |
          $bundle = "dist/mesen-agent-windows-x64"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "bin/win-x64/Release/mesen-agent.exe", "bin/win-x64/Release/MesenCore.dll", "LICENSE" -Destination $bundle
          & "$PWD/$bundle/mesen-agent.exe" --help | Out-Null
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist/mesen-agent-windows-x64.zip"
      - name: Test packaged CLI
        shell: bash
        run: |
          export MESEN_AGENT="$(cygpath -u "$GITHUB_WORKSPACE")/dist/mesen-agent-windows-x64/mesen-agent.exe"
          bash Headless/tests/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mesen-agent-windows-x64
          path: dist/mesen-agent-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish agent-only release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [skill, macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mesen-agent-*
          path: dist
          merge-multiple: true
      - name: Generate release checksums
        run: |
          cd dist
          sha256sum mesen-agent-* > SHA256SUMS
      - name: Publish native mesen-agent bundles
        uses: softprops/action-gh-release@v2
        with:
          name: mesen-agent ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Native, windowless `mesen-agent` command-line bundles for AI-driven emulation and debugging.

            These assets contain the CLI and required runtime libraries only. They do not contain the Mesen GUI application.
          files: |
            dist/mesen-agent-macos-arm64.tar.gz
            dist/mesen-agent-macos-x64.tar.gz
            dist/mesen-agent-linux-arm64.tar.gz
            dist/mesen-agent-linux-x64.tar.gz
            dist/mesen-agent-windows-x64.zip
            dist/SHA256SUMS
